<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant — SaveByAI</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/">SaveByAI<span>.</span></a><span class="alpha">MVP v0.3</span></header><main class="detail-wrap"><a class="back" href="/">← Back to SaveByAI</a><div id="detail" class="detail-card"><p>Loading merchant…</p></div></main><script type="module">const slug=new URLSearchParams(location.search).get('m');fetch('/data/merchants.json').then(r=>r.json()).then(ms=>{const m=ms.find(x=>x.slug===slug);const d=document.querySelector('#detail');if(!m){d.innerHTML='<h2>Merchant not found</h2>';return}document.title=m.name+' — SaveByAI';d.innerHTML=`<span class="kicker">${m.category}</span><h2>${m.name}</h2><p style="color:#6a8198;line-height:1.6">This route is prepared in the MVP but is not live until the relevant affiliate terms and customer-facing savings are verified.</p><div class="detail-grid"><div class="detail-item"><span>Candidate network</span><b>${m.network}</b></div><div class="detail-item"><span>MVP tier</span><b>${m.tier}</b></div><div class="detail-item"><span>Cashback rule</span><b>${m.cashbackRule}</b></div><div class="detail-item"><span>Approval dependency</span><b>${m.approvalDependency}</b></div></div><div class="checklist"><h3>Before we switch this route live</h3><ul><li>Confirm the programme is active for SaveByAI.</li><li>Confirm exact payout and eligible categories/customer types.</li><li>Confirm whether cashback/incentive traffic is allowed.</li><li>Confirm cookie, deeplink and SubID/click tracking support.</li><li>Record source and last-verified time in the master workbook.</li></ul></div><div class="pending">${m.nextVerification}</div>`})</script></body></html>
