ate tracking from customer cashback so an affiliate commission is never automatically presented as a cashback promise.</p><div class="checklist"><h3>What we verify before cashback goes live</h3><ul><li>The partner programme is active and available to SaveByAI.</li><li>Cashback/incentive traffic is expressly permitted.</li><li>The customer-facing cashback rate is set below sustainable affiliate economics.</li><li>Eligible categories, new/existing-user rules and exclusions are understood.</li><li>Click attribution is proven using SaveByAI click ID ↔ network SubID.</li><li>Pending/confirmed/declined states are handled correctly.</li></ul></div>${cb}`})</script></body></html>
